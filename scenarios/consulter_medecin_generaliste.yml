- name: 'Consulter un médecin généraliste'
  url: 'http://localhost:80/1de2cc29-8ee7-4891-ae78-dad162df2021'
  waitForSelector: .grid
  actions:
    - name: "Regarder les crénaux d'une autre semaine"
      type: 'click'
      element: '.timeslot-nav button:last-of-type'
      waitForTimeout: 500

    - name: "Retour à l'accueil"
      type: 'click'
      element: 'nav a[role="button"]'
      pageChange: true
      waitForSelector: '.doctor-card'

    - name: "Recherche d'un autre médecin généraliste"
      type: 'text'
      element: '#doctor-search'
      content: 'généraliste'

    - name: "Ouvrir le profil d'un second médecin généraliste"
      type: 'click'
      element: '.doctor-list article:nth-of-type(2) h3 a'
      pageChange: true

    - name: 'Consultation de ses créneaux'
      type: 'click'
      element: '.timeslot-nav button:last-of-type'
